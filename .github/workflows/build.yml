name: Build HyperPods HyperOS 4

on:
  workflow_dispatch:
  push:
    branches: ["os4-dev"]
    tags: ["v*"]
  pull_request:
    branches: ["os4-dev"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: 验证 APK 命名逻辑
        run: node --test .github/scripts/prepare-apk.test.cjs

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/hyperpods-release.jks"

      - name: Run unit tests and Android lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Check native scan boundaries
        run: bash app/src/test/cpp/run_tests.sh

      - name: Build signed release
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PKEYSTORE_FILE="$RUNNER_TEMP/hyperpods-release.jks" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"

      - name: Build pull request
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleDebug

      - name: 按版本名和短 MD5 命名 APK
        id: apk
        env:
          APK_VARIANT: ${{ github.event_name == 'pull_request' && 'debug' || 'release' }}
        run: node .github/scripts/prepare-apk.cjs

      - name: 直接上传 APK（不套 ZIP）
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
