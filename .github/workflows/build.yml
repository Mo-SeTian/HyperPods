name: Build HyperPods HyperOS 4

on:
  workflow_dispatch:
  push:
    branches: ["os4-dev"]
    tags: ["v*"]
  pull_request:
    branches: ["os4-dev"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/hyperpods-release.jks"

      - name: Build signed release
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PKEYSTORE_FILE="$RUNNER_TEMP/hyperpods-release.jks" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"

      - name: Build pull request
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleDebug

      - name: Rename release APK
        if: github.event_name != 'pull_request'
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/HyperPods-3.0.0-AAP-W-HyperOS4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperPods-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/HyperPods-3.0.0-AAP-W-HyperOS4.apk
